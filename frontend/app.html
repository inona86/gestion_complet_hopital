// ── Session (nouveau, additif) ────────────────────────────────────────────────
const authToken = sessionStorage.getItem('medibase_token');
const currentUser = JSON.parse(sessionStorage.getItem('medibase_user') || 'null');
if (!authToken || !currentUser) {
  window.location.href = 'login.html';
}

async function apiFetch(url, opts = {}) {
  const headers = Object.assign({}, opts.headers, { Authorization: `Bearer ${authToken}` });
  const r = await fetch(url, Object.assign({}, opts, { headers }));
  if (r.status === 401) {
    sessionStorage.removeItem('medibase_token');
    sessionStorage.removeItem('medibase_user');
    window.location.href = 'login.html';
    throw new Error('Session expirée');
  }
  return r;
}

function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if (isDark) {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('medibase_theme', 'light');
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
    localStorage.setItem('medibase_theme', 'dark');
  }
  syncThemeIcon();
}
function syncThemeIcon() {
  const btn = document.getElementById('theme-toggle');
  if (!btn) return;
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  btn.textContent = isDark ? '☀️' : '🌙';
}

// ── Notifications internes (nouveau, additif) ────────────────────────────────
let notifications = [];
async function loadNotifications() {
  try {
    const r = await apiFetch(`${API}/notifications`);
    notifications = await r.json();
  } catch { notifications = []; }
  const badge = document.getElementById('notif-badge');
  if (badge) {
    if (notifications.length) { badge.style.display = 'flex'; badge.textContent = notifications.length > 9 ? '9+' : notifications.length; }
    else { badge.style.display = 'none'; }
  }
}

function toggleNotifPanel() {
  const panel = document.getElementById('notif-panel');
  const willShow = panel.style.display === 'none';
  panel.style.display = willShow ? 'block' : 'none';
  if (willShow) renderNotifPanel();
}

function renderNotifPanel() {
  const panel = document.getElementById('notif-panel');
  panel.innerHTML = notifications.length
    ? notifications.map(n => `<div class="notif-item notif-${n.type}">${n.message}</div>`).join('')
    : `<div class="notif-empty">Aucune alerte pour le moment ✓</div>`;
}

document.addEventListener('click', (e) => {
  const wrap = document.querySelector('.notif-wrap');
  const panel = document.getElementById('notif-panel');
  if (wrap && panel && panel.style.display !== 'none' && !wrap.contains(e.target)) {
    panel.style.display = 'none';
  }
});

function logout() {
  sessionStorage.removeItem('medibase_token');
  sessionStorage.removeItem('medibase_user');

  caissier:    { factures:'rw', patients:'r' }
};
const ROLE_LABELS = {
  admin:'Administrateur', medecin:'Médecin', infirmier:'Infirmier(ère)',
  pharmacien:'Pharmacien(ne)', technicien:'Technicien(ne)',
  secretaire:'Secrétariat', caissier:'Facturation'
};
function accessLevel(tableKey) {
  const endpoint = TABLES[tableKey].endpoint;
  const allowed = ROLE_ACCESS[currentUser.role] || {};
  return allowed['*'] || allowed[endpoint] || null;
}
function canAccess(tableKey) { return !!accessLevel(tableKey); }
function canWrite(tableKey)  { return accessLevel(tableKey) === 'rw'; }

// ── Ping DB ────────────────────────────────────────────────────────────────
async function pingDB() {
  try {
    const r = await apiFetch(`${API}/ping`);
    const j = await r.json();
    if (j.status === 'ok') {
      document.getElementById('db-dot').className = 'dot ok';
      document.getElementById('db-label').textContent = 'MySQL connecté';
    } else throw new Error();
  } catch {
    document.getElementById('db-dot').className = 'dot err';
    document.getElementById('db-label').textContent = 'MySQL non connecté';
  }
}

// ── Fetch stats (counts) ───────────────────────────────────────────────────
async function fetchStats() {
  try {
    const r = await apiFetch(`${API}/stats`);
    const j = await r.json();
    state.counts = {
      medecin: j.medecins, patient: j.patients,
      infirmier: '-', pharmacien: '-', technicien: '-',
      dossier: '-', prescription: j.prescriptions,
      examen: j.examens, rdv: j.rdv, facture: j.factures
    };
    renderSidebar();
  } catch {}
}

// ── Fetch table data ───────────────────────────────────────────────────────
async function loadTable(tbl) {
  state.table = tbl;
  state.search = '';
  state.data = [];
  renderAll();
  try {
    const r = await apiFetch(`${API}/${TABLES[tbl].endpoint}`);
    state.data = await r.json();
    if (tbl === 'stock') {
      state.data.forEach(row => {
        row.alerte = Number(row.quantite) <= 0 ? 'Rupture'
                   : Number(row.quantite) <= Number(row.seuil_alerte) ? 'Stock bas'
                   : 'OK';
      });
    }
  } catch {
    showToast('Erreur de chargement', 'err');
    state.data = [];
  }
  renderAll();
}

const LOG_ACTION_LABEL = { CREATE: 'Création', UPDATE: 'Modification', DELETE: 'Suppression' };
const LOG_ACTION_BADGE = { CREATE: 'b-green', UPDATE: 'b-blue', DELETE: 'b-red' };

function renderLogs() {
  const term = state.search.toLowerCase();
  const rows = logsData.filter(l =>
    !term || `${l.nom_utilisateur} ${l.table_cible} ${l.action}`.toLowerCase().includes(term)
  );

  const tbody = rows.length ? rows.map(l => `
    <tr>
      <td style="white-space:nowrap;font-size:12px;color:#6b6961">${new Date(l.date_action).toLocaleString('fr-FR')}</td>
      <td>${l.nom_utilisateur || '—'}</td>
      <td><span class="badge">${l.role || '—'}</span></td>
      <td><span class="badge ${LOG_ACTION_BADGE[l.action] || ''}">${LOG_ACTION_LABEL[l.action] || l.action}</span></td>
      <td>${l.table_cible}</td>
      <td>${l.id_cible ?? '—'}</td>
    </tr>`).join('')
    : `<tr><td colspan="6" style="text-align:center;padding:36px;color:#9b9890;font-size:13px">Aucune activité enregistrée</td></tr>`;

  document.getElementById('main').innerHTML = `
    <div class="main-header">
      <div>
        <button class="breadcrumb-home" onclick="showHome()">← Tableau de bord</button>
        <div class="main-title">Journal d'activité</div>
        <div class="main-sub">${rows.length} action${rows.length!==1?'s':''} · 200 dernières entrées</div>
      </div>
    </div>
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-ico">⌕</span>
        <input class="search-input" type="text" placeholder="Rechercher (utilisateur, table, action)..." value="${state.search}"
          oninput="state.search=this.value;renderLogs()">
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Date</th><th>Utilisateur</th><th>Rôle</th><th>Action</th><th>Table</th><th>ID</th></tr></thead>
        <tbody>${tbody}</tbody>
      </table>
    </div>
  `;
}

const LIT_STATUS_COLOR = { 'Libre':'#3b8a1f', 'Occupé':'#c0392b', 'Réservé':'#c48a1a', 'Maintenance':'#6b6961' };
const LIT_STATUS_BG    = { 'Libre':'#eaf3de', 'Occupé':'#fcebeb', 'Réservé':'#faeeda', 'Maintenance':'#f1efe8' };

function renderLits() {
  const term = state.search.toLowerCase();
  const writable = canWrite('lit');
  const filtered = litsData.filter(l =>
    !term || `${l.numero} ${l.service} ${l.statut}`.toLowerCase().includes(term)
  );

  const services = [...new Set(litsData.map(l => l.service))];
  const counts = { 'Libre':0, 'Occupé':0, 'Réservé':0, 'Maintenance':0 };
  litsData.forEach(l => { counts[l.statut] = (counts[l.statut] || 0) + 1; });

  const servicesHtml = services.map(svc => {
    const beds = filtered.filter(l => l.service === svc);
    if (!beds.length) return '';
    return `
      <div class="lit-service">
        <div class="lit-service-title">${svc} <span>${beds.filter(b=>b.statut==='Libre').length} libre(s) / ${beds.length}</span></div>
        <div class="lit-grid">
          ${beds.map(b => `
            <button class="lit-tile" style="background:${LIT_STATUS_BG[b.statut]||'#f1efe8'};color:${LIT_STATUS_COLOR[b.statut]||'#5f5e5a'}"
              ${writable ? `onclick='openLitEdit(${JSON.stringify(b)})'` : 'disabled'}
              title="${b.numero} — ${b.statut}${b.id_patient ? ' · Patient #'+b.id_patient : ''}">
              <span class="lit-num">${b.numero}</span>
              <span class="lit-status">${b.statut}</span>
            </button>
          `).join('')}
        </div>
      </div>`;
  }).join('');

  document.getElementById('main').innerHTML = `
    <div class="main-header">
      <div>
        <button class="breadcrumb-home" onclick="showHome()">← Tableau de bord</button>
        <div class="main-title">Lits (occupation)</div>
        <div class="main-sub">${litsData.length} lits · ${services.length} services${writable?'':' · lecture seule'}</div>
      </div>
    </div>
    ${statsBar([
      {l:'Libres', v: counts['Libre']||0},
      {l:'Occupés', v: counts['Occupé']||0},
      {l:'Réservés', v: counts['Réservé']||0},
      {l:'Maintenance', v: counts['Maintenance']||0}
    ])}
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-ico">⌕</span>
        <input class="search-input" type="text" placeholder="Rechercher (numéro, service, statut)..." value="${state.search}"
          oninput="state.search=this.value;renderLits()">
      </div>
    </div>
    <div class="lit-wrap">${servicesHtml || '<div style="padding:36px;text-align:center;color:#9b9890;font-size:13px">Aucun lit</div>'}</div>
  `;
}

function openLitEdit(lit) {
  const ol = document.createElement('div');
  ol.className = 'overlay';
  ol.innerHTML = `<div class="modal" style="width:360px">
    <div class="modal-title">Lit ${lit.numero} — ${lit.service}</div>
    <div class="form-row full"><div class="form-group">
      <label class="form-label">Statut</label>
      <select class="form-select" id="lit-statut">
        ${['Libre','Occupé','Réservé','Maintenance'].map(s=>`<option value="${s}" ${s===lit.statut?'selected':''}>${s}</option>`).join('')}
      </select>
    </div></div>
    <div class="form-row full"><div class="form-group">
      <label class="form-label">ID Patient (si occupé — laisser vide sinon)</label>
      <input class="form-input" type="number" id="lit-patient" value="${lit.id_patient ?? ''}">
    </div></div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="this.closest('.overlay').remove()">Annuler</button>
      <button class="btn-save" onclick="saveLit(${lit.id_lit}, this)">Enregistrer</button>
    </div>
  </div>`;
  document.body.appendChild(ol);
  ol.addEventListener('click', e => { if (e.target === ol) ol.remove(); });
}

async function saveLit(id, btn) {
  const statut = document.getElementById('lit-statut').value;
  const patientVal = document.getElementById('lit-patient').value;
  const id_patient = patientVal === '' ? null : Number(patientVal);
  btn.disabled = true; btn.textContent = '...';
  try {
    const r = await apiFetch(`${API}/lits/${id}`, {
      method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ statut, id_patient })
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Erreur');
    showToast('Lit mis à jour ✓', 'ok');
    btn.closest('.overlay').remove();
    showLits();
  } catch(e) {
    showToast(e.message, 'err');
    btn.disabled = false; btn.textContent = 'Enregistrer';
  }
}

function svgBarChart(items, { width = 560, height = 180, color = '#185fa5', unit = '' } = {}) {
  if (!items || !items.length) return `<div class="fiche-empty">Aucune donnée</div>`;
  const max = Math.max(...items.map(i => Number(i.value) || 0), 1);
  const barW = Math.max(18, Math.min(54, (width - 20) / items.length - 10));
  const gap = (width - items.length * barW) / (items.length + 1);
  let bars = '';
  items.forEach((it, i) => {
    const v = Number(it.value) || 0;
    const h = Math.round((v / max) * (height - 42));
    const x = gap + i * (barW + gap);
    const y = height - 30 - h;
    bars += `<rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="4" fill="${color}"></rect>`;
    bars += `<text x="${x + barW/2}" y="${height - 14}" font-size="10" text-anchor="middle" fill="#6b6961">${(it.label||'—').toString().slice(0,12)}</text>`;
    bars += `<text x="${x + barW/2}" y="${y - 6}" font-size="11" text-anchor="middle" font-weight="700" fill="#1a1917">${v}${unit}</text>`;
  });
  return `<svg viewBox="0 0 ${width} ${height}" style="width:100%;height:${height}px">${bars}</svg>`;
}

  const cfg = TABLES[tbl];

  const rows = state.data.filter(r =>
    !q || Object.values(r).some(v => String(v).toLowerCase().includes(q))
  );

  // Stats bar
  let statsHtml = '';
  if (tbl === 'medecin') {
    statsHtml = statsBar([
      {l:'Médecins', v: state.data.length},
      {l:'Patients', v: state.counts.patient||'—'},
      {l:'Prescriptions', v: state.counts.prescription||'—'},
      {l:'Examens', v: state.counts.examen||'—'}
    ]);
  } else if (tbl === 'patient') {
    statsHtml = statsBar([
      {l:'Patients', v: state.data.length},
      {l:'Médecins', v: state.counts.medecin||'—'},
      {l:'RDV total', v: state.counts.rdv||'—'},
      {l:'Dossiers', v: state.counts.dossier||'—'}
    ]);
  } else if (tbl === 'facture') {
    const total = state.data.reduce((s,f)=>s+(parseFloat(f.montant)||0),0);
    const payees = state.data.filter(f=>f.statut_paiement==='Payée').length;
    const impayees = state.data.filter(f=>f.statut_paiement==='Impayée').length;
    statsHtml = statsBar([
      {l:'Total factures', v: state.data.length},
      {l:'Montant total', v: total.toLocaleString()+' F'},
      {l:'Payées', v: payees},
      {l:'Impayées', v: impayees}
    ]);
  } else if (tbl === 'stock') {
    const rupture = state.data.filter(s=>s.alerte==='Rupture').length;
    const bas = state.data.filter(s=>s.alerte==='Stock bas').length;
    statsHtml = statsBar([
      {l:'Produits', v: state.data.length},
      {l:'En rupture', v: rupture},
      {l:'Stock bas', v: bas},
      {l:'OK', v: state.data.length - rupture - bas}
    ]);
  }

  // Table headers
  const writable = canWrite(tbl);
  const hasPdf = (tbl === 'facture' || tbl === 'dossier');
  const hasFiche = tbl === 'patient';
  const showActionsCol = writable || hasPdf || hasFiche;
  const thead = `<tr>${cfg.cols.map(c=>`<th>${c.l}</th>`).join('')}${showActionsCol ? '<th>Actions</th>' : ''}</tr>`;

  // Table rows
  const tbody = rows.length
    ? rows.map(row => {
        const cells = cfg.cols.map(c => {
          let val = row[c.k];
          if (val === null || val === undefined) val = '—';
          if (c.type === 'id')    return `<td class="id-cell">#${val}</td>`;
          if (c.type === 'money') return `<td>${Number(val).toLocaleString()} FCFA</td>`;
          if (c.badge)     return `<td><span class="badge ${c.badge}">${val}</span></td>`;
          if (c.badge_fn)  {
            const txt = c.badge_txt ? c.badge_txt(val) : val;
            return `<td><span class="badge ${c.badge_fn(val)}">${txt}</span></td>`;
          }
          return `<td title="${val}">${val}</td>`;
        }).join('');
        const pkVal = row[cfg.pk];
        const pdfBtn = hasPdf ? `<button class="btn-pdf" onclick="downloadPdf('${tbl}',${pkVal})">PDF</button>` : '';
        const ficheBtn = hasFiche ? `<button class="btn-pdf" onclick="showPatientFiche(${pkVal})">Fiche</button>` : '';
        const writeBtns = writable ? `
          <button class="btn-edit" onclick='openEdit(${JSON.stringify(row)})'>Modifier</button>
          <button class="btn-del"  onclick="deleteRow(${pkVal})">Suppr.</button>` : '';
        const actions = showActionsCol ? `<td><div class="act-cell">${pdfBtn}${ficheBtn}${writeBtns}</div></td>` : '';
        return `<tr>${cells}${actions}</tr>`;
      }).join('')
    : `<tr><td colspan="${cfg.cols.length+(showActionsCol?1:0)}" style="text-align:center;padding:36px;color:#9b9890;font-size:13px">Aucun enregistrement</td></tr>`;

  document.getElementById('main').innerHTML = `
    <div class="main-header">
      <div>
        <button class="breadcrumb-home" onclick="showHome()">← Tableau de bord</button>
        <div class="main-title">${cfg.label}</div>
        <div class="main-sub">${rows.length} enregistrement${rows.length!==1?'s':''} · Table ${cfg.endpoint}${writable?'':' · lecture seule'}</div>
      </div>
      ${writable ? `<button class="header-btn" onclick="openAdd()">+ Ajouter</button>` : ''}    </div>
    ${statsHtml}
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-ico">⌕</span>

        <tbody>${tbody}</tbody>

    </div>
  `;
}

function buildForm(fields, data={}) {
  let html = '';
  for (let i = 0; i < fields.length; i++) {
    const f = fields[i];
    if (f.full) {
      if (html) {}
      html += `<div class="form-row full"><div class="form-group">
        <label class="form-label">${f.l}</label>
        <input class="form-input" type="${f.t||'text'}" name="${f.k}" value="${data[f.k]||''}" placeholder="${f.l}...">
      </div></div>`;
    } else {
      const next = fields[i+1];
      if (!next || next.full) {
        html += `<div class="form-row full"><div class="form-group">
          <label class="form-label">${f.l}</label>
          <input class="form-input" type="${f.t||'text'}" name="${f.k}" value="${data[f.k]||''}" placeholder="${f.l}...">
        </div></div>`;
      } else {
        html += `<div class="form-row">
          <div class="form-group"><label class="form-label">${f.l}</label>
            <input class="form-input" type="${f.t||'text'}" name="${f.k}" value="${data[f.k]||''}" placeholder="${f.l}...">
          </div>
          <div class="form-group"><label class="form-label">${next.l}</label>
            <input class="form-input" type="${next.t||'text'}" name="${next.k}" value="${data[next.k]||''}" placeholder="${next.l}...">
          </div>
        </div>`;
        i++;
      }
    }
  }
  return html;
}

function openAdd() {
  const cfg = TABLES[state.table];
  const ol = document.createElement('div');
  ol.className = 'overlay';
  ol.innerHTML = `<div class="modal">
    <div class="modal-title">Ajouter — ${cfg.label}</div>
    <div id="mform">${buildForm(cfg.form)}</div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="this.closest('.overlay').remove()">Annuler</button>
      <button class="btn-save" id="btn-save" onclick="submitAdd(this)">Enregistrer</button>
    </div>
  </div>`;
  document.body.appendChild(ol);
  ol.addEventListener('click', e => { if(e.target===ol) ol.remove(); });
}

function openEdit(row) {
  const cfg = TABLES[state.table];
  const ol = document.createElement('div');
  ol.className = 'overlay';
  ol.innerHTML = `<div class="modal">
    <div class="modal-title">Modifier — #${row[cfg.pk]}</div>
    <div id="mform">${buildForm(cfg.form, row)}</div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="this.closest('.overlay').remove()">Annuler</button>
      <button class="btn-save" id="btn-save" onclick="submitEdit(this,${row[cfg.pk]})">Enregistrer</button>
    </div>
  </div>`;
  document.body.appendChild(ol);
  ol.addEventListener('click', e => { if(e.target===ol) ol.remove(); });
}

function collectForm() {
  const inputs = document.querySelectorAll('#mform input');
  const data = {};
  inputs.forEach(inp => {
    if (inp.value !== '') data[inp.name] = inp.type==='number' ? Number(inp.value) : inp.value;
  });
  return data;
}

// ── Export PDF (factures, dossiers) ──────────────────────────────────────────
async function downloadPdf(tbl, id) {
  const endpoint = tbl === 'facture' ? 'factures' : 'dossiers';
  try {
    const r = await apiFetch(`${API}/${endpoint}/${id}/pdf`);
    if (!r.ok) throw new Error('Erreur lors de la génération du PDF');
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${tbl}-${id}.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  } catch(e) { showToast(e.message, 'err'); }
}

// ── Vérification allergie ↔ prescription (nouveau, additif) ─────────────────
async function checkAllergieIfNeeded(data) {
  if (state.table !== 'prescription' || !data.id_dossier || !data.posologie) return true;
  try {
    const r = await apiFetch(`${API}/prescriptions/check-allergie`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ id_dossier: data.id_dossier, posologie: data.posologie })
    });
    const j = await r.json();
    if (j.warning) return confirm(`${j.warning}\n\nConfirmer quand même l'enregistrement ?`);
  } catch { /* vérification indisponible : on laisse l'enregistrement se faire normalement */ }
  return true;
}

async function submitAdd(btn) {
  const cfg = TABLES[state.table];
  const data = collectForm();
  if (!(await checkAllergieIfNeeded(data))) return;
  btn.disabled = true; btn.textContent = '...';
  try {
    const r = await apiFetch(`${API}/${cfg.endpoint}`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data)
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Erreur');
    showToast(state.table === 'rdv' ? 'RDV enregistré — email de confirmation envoyé ✓' : 'Enregistrement ajouté ✓', 'ok');
    btn.closest('.overlay').remove();
    await loadTable(state.table);
    fetchStats();
  } catch(e) {
    showToast(e.message, 'err');
    btn.disabled = false; btn.textContent = 'Enregistrer';
  }
}

async function submitEdit(btn, id) {
  const cfg = TABLES[state.table];
  const data = collectForm();
  if (!(await checkAllergieIfNeeded(data))) return;
  btn.disabled = true; btn.textContent = '...';
  try {
    const r = await apiFetch(`${API}/${cfg.endpoint}/${id}`, {
      method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data)
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Erreur');
    showToast('Modifications enregistrées ✓', 'ok');
    btn.closest('.overlay').remove();
    await loadTable(state.table);
  } catch(e) {
    showToast(e.message, 'err');
    btn.disabled = false; btn.textContent = 'Enregistrer';
  }
}

async function deleteRow(id) {
  if (!confirm('Supprimer cet enregistrement ?')) return;
  const cfg = TABLES[state.table];
  try {
    const r = await apiFetch(`${API}/${cfg.endpoint}/${id}`, { method:'DELETE' });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Erreur');
    showToast('Supprimé ✓', 'ok');
    await loadTable(state.table);
    fetchStats();
  } catch(e) { showToast(e.message, 'err'); }
}

// ── Toast ──────────────────────────────────────────────────────────────────
function showToast(msg, type='ok') {
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// ── Raccourcis clavier (nouveau, additif) ────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const ol = document.querySelector('.overlay');
    if (ol) ol.remove();
    return;
  }
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
    const inp = document.querySelector('.search-input');
    if (inp) { e.preventDefault(); inp.focus(); }
  }
});

function renderUserBadge() {
  const el = document.getElementById('user-badge');
  if (!currentUser) return;
  const adminLink = currentUser.role === 'admin'
    ? `<button class="topbar-icon-link" onclick="showAnalytics()" title="Statistiques analytiques" style="background:none;border:none;cursor:pointer">📊</button>
       <a class="topbar-icon-link" href="admin-utilisateurs.html" title="Gestion des comptes">⚙️</a>
       <a class="topbar-icon-link" href="/api-docs" target="_blank" title="Documentation API (Swagger)">📚</a>` : '';
  el.innerHTML = `
    ${adminLink}
    <a class="topbar-icon-link" href="profil.html" title="Mon profil">👤</a>
    <span class="user-name">${currentUser.prenom} ${currentUser.nom}</span>
    <span class="user-role">${ROLE_LABELS[currentUser.role] || currentUser.role}</span>
    <button class="logout-btn" onclick="logout()" title="Se déconnecter">⏻</button>
  `;
}

(async () => {
  renderUserBadge();
  syncThemeIcon();
  await pingDB();
  await fetchStats();
  loadNotifications();
  showHome();
})();
</script>
